<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="sp-logo">
  <style>
    /* Inlined in the page, the site's theme tokens win; as a favicon they are
       undefined, so the fallbacks and the OS colour scheme apply. Every rule is
       scoped to .sp-logo so nothing leaks into the page when inlined. */
    .sp-logo { --sp-edge: var(--ink-3, #5f646e); --sp-path: var(--accent, #1f4fd1); }
    @media (prefers-color-scheme: dark) {
      .sp-logo { --sp-edge: var(--ink-3, #8191aa); --sp-path: var(--accent, #7ea9ff); }
    }
    .sp-logo .edge { stroke: var(--sp-edge); }
    .sp-logo .node { fill: var(--sp-edge); }
    .sp-logo .path { stroke: var(--sp-path); }
    .sp-logo .hit { fill: var(--sp-path); }
  </style>
  <!-- a graph with the shortest path lit up -->
  <path class="edge" d="M6 7.25L24.75 4.75M24.75 4.75L26 23.5M8.5 26L26 23.5M8.5 26L16 14.75M6 7.25L8.5 26" stroke-width="1.75" stroke-linecap="round" fill="none"/>
  <path class="path" d="M6 7.25l10 7.5 10 8.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle class="node" cx="24.75" cy="4.75" r="2.5"/>
  <circle class="node" cx="8.5" cy="26" r="2.5"/>
  <circle class="hit" cx="6" cy="7.25" r="3.5"/>
  <circle class="hit" cx="16" cy="14.75" r="2.75"/>
  <circle class="hit" cx="26" cy="23.5" r="3.5"/>
</svg>
